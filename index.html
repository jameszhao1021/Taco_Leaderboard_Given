<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Taco Leaderboard</title>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;

      margin: 0;
      padding: 0;

      overflow: hidden;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;

      color: #ffffff;

      background-image: url("./background.png");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }


    /* =========================
       Background Overlay
       ========================= */

    body::before {
      content: "";

      position: fixed;

      inset: 0;

      background: rgba(0, 0, 0, 0.15);

      z-index: 0;
    }


    /* =========================
       Main Container
       ========================= */

    .container {
      position: relative;

      z-index: 1;

      width: 90%;
      max-width: 1200px;

      height: 100vh;

      margin: 0 auto;

      padding: 3vh 0;

      display: flex;

      flex-direction: column;
    }


    /* =========================
       Header
       ========================= */

    .header {
      flex-shrink: 0;

      text-align: center;

      margin-bottom: 2vh;
    }

    .taco-icon {
      line-height: 1;
      margin-bottom: 1vh;
    }

    .taco-icon img {
      width: clamp(40px, 5vh, 75px);
      height: auto;
      display: inline-block;
}

    .title {
      margin: 0;

      font-size: clamp(32px, 5vh, 65px);

      font-weight: 700;

      line-height: 1.1;

      text-align: center;
    }


    /* =========================
       Leaderboard
       ========================= */

    .leaderboard {
      width: 1000px;
      max-width: 100%;

      margin: 0 auto;

      flex: 1;

      min-height: 0;

      display: flex;

      flex-direction: column;

      border-radius: 22px;

      overflow: hidden;

      background: rgba(0, 0, 0, 0.45);

      backdrop-filter: blur(8px);

      -webkit-backdrop-filter: blur(8px);
    }


    /* =========================
       Three Equal Columns
       ========================= */

    .table-header,
    .leaderboard-row {
      display: grid;

      grid-template-columns: repeat(3, 1fr);

      align-items: center;

      width: 100%;

      padding: 0 4%;

      column-gap: 20px;
    }


    /* =========================
       Table Header
       ========================= */

    .table-header {
      flex-shrink: 0;

      height: 7vh;

      min-height: 45px;

      background: rgba(0, 0, 0, 0.4);

      font-size: clamp(16px, 2.2vh, 28px);

      font-weight: 700;

      border-bottom:
        1px solid rgba(255, 255, 255, 0.18);
    }

    .table-header > div {
      text-align: left;
    }


    /* =========================
       Rows Container
       ========================= */

    #leaderboardRows {
      flex: 1;

      min-height: 0;

      display: flex;

      flex-direction: column;
    }


    /* =========================
       Leaderboard Row
       ========================= */

    .leaderboard-row {
      flex: 1 1 0;

      min-height: 0;

      border-bottom:
        1px solid rgba(255, 255, 255, 0.12);

      font-size: clamp(14px, 2.5vh, 32px);

      transition: background 0.2s ease;
    }

    .leaderboard-row:last-child {
      border-bottom: none;
    }


    /* =========================
       Ranking
       ========================= */

    .ranking {
      width: 100%;

      display: grid;

      /*
        Medal gets its own space.
        All ranking numbers therefore
        start at exactly the same position.
      */

      grid-template-columns: 42px 1fr;

      align-items: center;

      font-size: inherit;

      font-weight: 700;

      white-space: nowrap;
    }


    /* Medal */

    .ranking-medal {
      width: 42px;

      text-align: left;

      line-height: 1;
    }


    /* Ranking Number */

    .ranking-number {
      text-align: left;

      font-weight: 700;
    }


    /* =========================
       Name
       ========================= */

    .name {
      width: 100%;

      text-align: left;

      font-weight: 600;

      overflow: hidden;

      text-overflow: ellipsis;

      white-space: nowrap;
    }


    /* =========================
       Taco Count
       ========================= */

    .tacos {
      width: 100%;

      text-align: left;

      font-weight: 700;

      white-space: nowrap;
    }

    .taco-small {
      width: 1.2em;
      height: 1.2em;
      object-fit: contain;
      vertical-align: -0.2em;
      margin-left: 8px;
    }

    .ranking-medal {
      width: 42px;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      line-height: 1;
    }

    .ranking-medal-img {
      width: 1em;
      height: 1em;
      object-fit: contain;
      display: block;
    }

    /* =========================
       Top 3 Background
       ========================= */

    .rank-1 {
      background: rgba(255, 215, 0, 0.12);
    }

    .rank-2 {
      background: rgba(192, 192, 192, 0.10);
    }

    .rank-3 {
      background: rgba(205, 127, 50, 0.10);
    }


    /* =========================
       Status
       ========================= */

    .status {
      display: none;

      flex: 1;

      align-items: center;

      justify-content: center;

      padding: 20px;

      text-align: center;

      font-size: clamp(18px, 2.5vh, 32px);
    }


    /* =========================
       Smaller Screens
       ========================= */

    @media (max-width: 900px) {

      .container {
        width: 95%;

        padding: 2vh 0;
      }

      .leaderboard {
        width: 100%;
      }

      .table-header,
      .leaderboard-row {
        grid-template-columns: repeat(3, 1fr);

        padding: 0 20px;

        column-gap: 10px;
      }

      .ranking {
        grid-template-columns: 35px 1fr;
      }

      .ranking-medal {
        width: 35px;
      }

    }

  </style>
</head>


<body>

  <main class="container">


    <!-- =========================
         Header
         ========================= -->

    <header class="header">

    <div class="taco-icon">
  <img src="./taco.png" alt="Taco">
</div>

      <h1
        class="title"
        id="title"
      >
        Taco Rankings
      </h1>

    </header>


    <!-- =========================
         Leaderboard
         ========================= -->

    <section class="leaderboard">


      <!-- Column Headers -->

      <div class="table-header">

        <div>
          Ranking
        </div>

        <div>
          Name
        </div>

        <div>
          Tacos Given
        </div>

      </div>


      <!-- Dynamic Rows -->

      <div id="leaderboardRows"></div>


      <!-- Status -->

      <div
        class="status"
        id="status"
      >
        Loading leaderboard...
      </div>


    </section>

  </main>



  <script>

    /*
    ==========================================
    Supabase Configuration
    ==========================================
    */

    const SUPABASE_URL =
      "https://fjjpprbooqdrcdcbgrjn.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_k7ATPOqoO1xd0dFCAMdwcg_hsSx4wAd";


    const supabaseClient =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
      );


    /*
    ==========================================
    Dynamic Month Title
    ==========================================
    */

    function setMonthTitle() {

      const month =
        new Date().toLocaleString(
          "en-AU",
          {
            month: "long",
            timeZone: "Australia/Perth"
          }
        );


      document.getElementById(
        "title"
      ).textContent =
        `${month} Taco Rankings`;

    }


    /*
    ==========================================
    Medal
    ==========================================
    */

    function getRankingMedal(ranking) {
      if (ranking === 1) return "./gold.png";
      if (ranking === 2) return "./silver.png";
      if (ranking === 3) return "./bronze.png";
      return "";
    }


    /*
    ==========================================
    Render Leaderboard
    ==========================================
    */

    function renderLeaderboard(data) {

      const rows =
        document.getElementById(
          "leaderboardRows"
        );


      const status =
        document.getElementById(
          "status"
        );


      rows.innerHTML = "";


      if (
        !Array.isArray(data) ||
        data.length === 0
      ) {

        status.style.display =
          "flex";

        status.textContent =
          "No Taco rankings yet.";

        return;

      }


      status.style.display =
        "none";


      /*
      Sort by ranking
      */

      const sortedData =
        [...data].sort(
          (a, b) =>
            Number(a.ranking) -
            Number(b.ranking)
        );


      sortedData.forEach(
        (user) => {


          const ranking =
            Number(user.ranking);


          const tacoCount =
            Number(user.tacos_given) || 0;


          /*
          Ignore zero Taco users
          */

          if (tacoCount <= 0) {
            return;
          }


          /*
          Create Row
          */

          const row =
            document.createElement(
              "div"
            );


          row.className =
            "leaderboard-row";


          if (ranking === 1) {

            row.classList.add(
              "rank-1"
            );

          }


          if (ranking === 2) {

            row.classList.add(
              "rank-2"
            );

          }


          if (ranking === 3) {

            row.classList.add(
              "rank-3"
            );

          }


          /*
          ==================================
          Ranking
          ==================================
          */

          const rankingElement =
            document.createElement(
              "div"
            );


          rankingElement.className =
            "ranking";


          /*
          Medal
          */

          const medalElement =
            document.createElement(
              "span"
            );


          medalElement.className =
            "ranking-medal";


    const medalSrc = getRankingMedal(ranking);

    if (medalSrc) {
      const medalImg = document.createElement("img");

      medalImg.src = medalSrc;
      medalImg.alt = `Rank ${ranking}`;
      medalImg.className = "ranking-medal-img";

      medalElement.appendChild(medalImg);
    }

          /*
          Ranking Number
          */

          const numberElement =
            document.createElement(
              "span"
            );


          numberElement.className =
            "ranking-number";


          numberElement.textContent =
            ranking;


          rankingElement.appendChild(
            medalElement
          );


          rankingElement.appendChild(
            numberElement
          );


          /*
          ==================================
          Name
          ==================================
          */

          const nameElement =
            document.createElement(
              "div"
            );


          nameElement.className =
            "name";


          nameElement.textContent =
            user.name || "Unknown";


          /*
          ==================================
          Taco Count
          ==================================
          */

          const tacosElement =
            document.createElement(
              "div"
            );


          tacosElement.className =
            "tacos";


          const countElement =
            document.createElement(
              "span"
            );


          countElement.textContent =
            tacoCount;


          const tacoElement =
            document.createElement("img");

          tacoElement.className =
            "taco-small";

          tacoElement.src =
            "./taco.png";

          tacoElement.alt =
            "Taco";


          tacosElement.appendChild(
            countElement
          );


          tacosElement.appendChild(
            tacoElement
          );


          /*
          ==================================
          Add Elements To Row
          ==================================
          */

          row.appendChild(
            rankingElement
          );


          row.appendChild(
            nameElement
          );


          row.appendChild(
            tacosElement
          );


          rows.appendChild(
            row
          );

        }
      );

    }


    /*
    ==========================================
    Load Leaderboard From Supabase
    ==========================================
    */

    async function loadLeaderboard() {

      const status =
        document.getElementById(
          "status"
        );


      try {

        const {
          data,
          error
        } =
          await supabaseClient

            .from(
              "taco_leaderboard_given"
            )

            .select(
              "id,user_id,name,ranking,tacos_given,updated_at"
            )

            .gt(
              "tacos_given",
              0
            )

            .order(
              "ranking",
              {
                ascending: true
              }
            );


        if (error) {
          throw error;
        }


        console.log(
          "Leaderboard:",
          data
        );


        renderLeaderboard(
          data
        );

      }

      catch (error) {

        console.error(
          "Unable to load leaderboard:",
          error
        );


        status.style.display =
          "flex";


        status.textContent =
          "Unable to load leaderboard.";

      }

    }


    /*
    ==========================================
    Supabase Realtime
    ==========================================
    */

    let reloadTimer;


    function subscribeToLeaderboard() {

      supabaseClient

        .channel(
          "taco-leaderboard"
        )

        .on(

          "postgres_changes",

          {
            event: "*",
            schema: "public",
            table: "taco_leaderboard_given"
          },

          () => {

            /*
            Debounce updates because n8n may
            update multiple leaderboard rows
            at the same time.
            */

            clearTimeout(
              reloadTimer
            );


            reloadTimer =
              setTimeout(
                () => {

                  loadLeaderboard();

                },
                500
              );

          }

        )

        .subscribe(
          (status) => {

            console.log(
              "Realtime status:",
              status
            );

          }
        );

    }


    /*
    ==========================================
    Start App
    ==========================================
    */

    setMonthTitle();

    loadLeaderboard();

    subscribeToLeaderboard();


  </script>

</body>

</html>
